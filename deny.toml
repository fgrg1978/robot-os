# cargo-deny configuration — supply-chain policy gates for CI.
#
# Run locally:  cargo deny check
# CI:           NOT wired up. There is no `.github/workflows/` in this repo
#               (verified 2026-08-20); the only gate that actually runs is
#               `bash tools/ci_check.sh`, which does not invoke cargo-deny.
#               Run `cargo deny check` by hand until that changes.

[graph]
# Multi-target check so a dep that's only-Linux can't sneak in.
targets = [
    { triple = "riscv64imac-unknown-none-elf" },
    { triple = "aarch64-unknown-none-softfloat" },
    { triple = "x86_64-unknown-none" },
    { triple = "aarch64-apple-darwin" },
]

# ── Advisories: block known CVEs + unmaintained crates ────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked  = "deny"
ignore  = []

# ── Licenses: only allow what's compatible with Apache-2.0 ────────
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
# Confidence threshold for license detection — 0.8 = high.
confidence-threshold = 0.8
exceptions = []

# ── Bans: enforce no duplicate versions + dep size discipline ─────
[bans]
multiple-versions = "warn"
wildcards         = "deny"
highlight         = "all"

# Explicit allow list for deps justified by audit comments.
deny = [
    # OpenSSL — we ship pure-Rust crypto only.
    { crate = "openssl",      reason = "Use ed25519-dalek + curve25519-dalek." },
    { crate = "openssl-sys",  reason = "Same — no C deps in the kernel." },
    # ring — fine elsewhere, but pulls in asm we'd have to vet per ISA.
    { crate = "ring",         reason = "ed25519-dalek / curve25519-dalek already cover our needs." },
]

# ── Sources: only crates.io + this repo's path deps ───────────────
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
