[build]
target = "riscv64imac-unknown-none-elf"

# Override parent workspace rustflags completely.
# Cargo merges hierarchically, but we specify ALL flags here
# and the parent's -Tkernel/linker.ld will also be added.
# To avoid that, we add [workspace] to our Cargo.toml.
[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tuser.ld",
    "-C", "code-model=medium",
    "-C", "target-feature=+zaamo,+zalrsc",
]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]
