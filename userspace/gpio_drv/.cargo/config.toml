# Mirrors userspace/reflex: build a ring-3 ELF for the kernel's exec path.
[build]
target = "riscv64imac-unknown-none-elf"

[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tuser.ld",
    "-C", "code-model=medium",
    "-C", "target-feature=+zaamo,+zalrsc",
]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]
