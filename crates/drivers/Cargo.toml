[package]
name = "robot_os_drivers"
version = "0.1.0"
edition = "2021"

# Platform feature flags.
# Default (no feature): targets QEMU virt machine.
# --features vf2: targets StarFive VisionFive 2 (JH7110 SoC).
# --features k1:  targets SpacemiT K1 (BananaPi BPI-F3, RV64GCVB).
[features]
vf2     = []
k1      = []
esp32c3 = ["robot_os_arch/esp32c3"]
# Relaxed WCET bounds for QEMU emulated environment.
qemu    = []

[dependencies]
robot_os_arch   = { workspace = true }
robot_os_sync   = { workspace = true }
robot_os_common = { workspace = true }
robot_os_mm     = { workspace = true }
