[package]
name = "robot_os_arch_riscv64"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PHANES — RISC-V (rv64gc + Sv39 + PMP + SBI + RVV-opt) ISA crate. Was crates/arch pre-Stage-1; now lives behind the crates/arch facade per rfcs/item-2-kernel-cross-arch-plan.md."

[lib]
name = "robot_os_arch_riscv64"

# rvv: enable RISC-V Vector Extension (RVV 1.0) math kernels.
# Requires QEMU with -cpu rv64,v=true,vlen=128,vext_spec=v1.0.
# VisionFive 2 (SiFive U74) does NOT support the V extension.
[features]
rvv = []

[dependencies]
robot_os_common   = { workspace = true }
robot_os_arch_api = { workspace = true }
bitflags          = { workspace = true }
