[package]
name = "robot_os_ml"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# rvv: use dot_f32_rvv (RVV 1.0) for linear-layer dot products.
# Requires QEMU with -cpu rv64,v=true,vlen=128,vext_spec=v1.0.
[features]
rvv = ["robot_os_arch/rvv"]

[dependencies]
robot_os_arch = { workspace = true }
