[package]
name = "robot_os_ota"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
vf2     = []
k1      = []
# Force `CFG_SECURE_BOOT_REQUIRE_SIG = 1` at build time. Production / release
# builds should always pass this so a binary cannot ship with signature
# enforcement disabled by accident (`secure_boot.rs:85`).
secure-boot-enforced = []

[dependencies]
robot_os_fs = { workspace = true }
robot_os_config = { workspace = true }
robot_os_drivers = { workspace = true }
robot_os_crypto = { path = "../crypto" }
robot_os_limits = { workspace = true }
