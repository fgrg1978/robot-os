[package]
name = "robot_os_sched"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
no-mmu = []
# Set only when the kernel is built with --features rvv (QEMU-only vector-
# extension benchmark path, see kernel/Cargo.toml). context_switch_rvv.S
# doesn't call mark_context_saved(), so the context_saving-dependent code
# in scheduler.rs must compile out under this feature — see the cfg-gated
# spots there for why.
rvv = []

[dependencies]
robot_os_mm = { workspace = true }
robot_os_arch = { workspace = true }
robot_os_sync = { workspace = true }
robot_os_common = { workspace = true }
robot_os_limits = { workspace = true }
robot_os_drivers = { workspace = true }
wcet-macro = { path = "../wcet-macro" }
