[package]
name = "robot_os_arch"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Fachada por target_arch que reexporta la ISA activa. Hoy solo riscv64: aarch64 y x86_64 se aparcaron en newfeatures/ el 2026-08-20 (ver newfeatures/README.md)."

[lib]
name = "robot_os_arch"

# The riscv feature flags (rvv) are forwarded so existing kernel
# Cargo.tomls that turn them on via robot_os_arch still affect the
# underlying impl.
[features]
rvv     = ["robot_os_arch_riscv64/rvv"]

# Per-target_arch deps: each is only pulled in for builds whose
# target arch matches. On riscv64 (the only ISA the kernel boots
# today) only robot_os_arch_riscv64 is compiled.
[target.'cfg(target_arch = "riscv64")'.dependencies]
robot_os_arch_riscv64 = { workspace = true }

