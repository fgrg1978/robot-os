\* TLC configuration for driver_registry.tla.
\* Small bounds keep the state space tractable while exercising
\* every interesting transition (fill-to-capacity + duplicate-
\* reject).

SPECIFICATION Spec

CONSTANTS
    Capacity = 3
    Kinds = {1, 2, 3, 4}
    MaxOps = 8

INVARIANTS
    NoDuplicateKinds
    CapacityRespected
    FindByKindCorrect

CHECK_DEADLOCK FALSE
