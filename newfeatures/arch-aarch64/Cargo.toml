[package]
name = "robot_os_arch_aarch64"
version = "0.1.0"
edition = "2021"
description = "PHANES Phase 2 — aarch64 ISA impl of robot_os_arch_api (Cpu / Interrupts / Mmu / Boot for VMSAv8-64 + PSCI). GIC v3 + boot.S deferred to B1.boot."
license = "Apache-2.0"
repository = "https://github.com/phanes-project/phanes"

[lib]
name = "robot_os_arch_aarch64"

# This crate is a workspace member so its types + struct
# definitions are always available (the arch-api trait surface is
# target-agnostic). The asm bodies are cfg-gated to
# `target_arch = "aarch64"` — on the workspace's default riscv64
# target the crate compiles cleanly as essentially-empty.
#
# To actually exercise the impls:
#   rustup target add aarch64-unknown-none-softfloat
#   cargo build --target aarch64-unknown-none-softfloat \
#       -p robot_os_arch_aarch64

[dependencies]
robot_os_arch_api = { workspace = true }
bitflags          = { workspace = true }
