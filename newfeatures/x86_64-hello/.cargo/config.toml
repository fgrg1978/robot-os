# Standalone x86_64-bare-metal build.

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=-T./x86_64-q35.ld",
    # Force static (non-PIE) linking. Without this rust-lld
    # rejects the R_X86_64_32 relocations the boot asm needs to
    # build the 6-byte lgdt operand (`.long _gdt`).
    "-C", "relocation-model=static",
    "-C", "link-arg=--no-pie",
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
